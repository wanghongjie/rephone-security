import org.jetbrains.kotlin.gradle.tasks.KotlinCompile
allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://storage.flutter-io.cn/download.flutter.io' }
        maven { url 'https://jitpack.io' }
        google()
        mavenCentral()
    }
}

ext {
    compileSdkVersion = 36
    targetSdkVersion = 36
    minSdkVersion = 23
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def flutterVersionName = localProperties.getProperty("flutter.versionName", "1.0.0")
def flutterVersionCode = localProperties.getProperty("flutter.versionCode", "1")

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

tasks.register("renameFlutterReleaseApk", Copy) {
    from("$rootProject.buildDir/app/outputs/apk/release/app-release.apk")
    into("$rootProject.buildDir/app/outputs/apk/release")
    rename { String fileName ->
        "app-v${flutterVersionName}(${flutterVersionCode})-release.apk"
    }
}

tasks.register("renameFlutterReleaseBundle", Copy) {
    from("$rootProject.buildDir/app/outputs/bundle/release/app-release.aab")
    into("$rootProject.buildDir/app/outputs/bundle/release")
    rename { String fileName ->
        "app-v${flutterVersionName}(${flutterVersionCode})-release.aab"
    }
}

// Force all Android library subprojects (e.g. wakelock_plus) to use root compileSdk so we don't
// need to install extra SDK platforms (avoids corrupted Platform 33 download).
subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        def androidExt = subproject.extensions.findByName("android")
        if (androidExt != null) {
            androidExt.compileSdkVersion rootProject.ext.compileSdkVersion
            if (androidExt.defaultConfig != null) {
                androidExt.defaultConfig.targetSdkVersion rootProject.ext.targetSdkVersion
                androidExt.defaultConfig.minSdkVersion rootProject.ext.minSdkVersion
            }
        }
    }
}
// Legacy fix for old gallery_saver only (not used when using gallery_saver_plus)
subprojects { subproject ->
    if (subproject.name == "gallery_saver") {
        subproject.plugins.withId("com.android.library") {
            def androidExt = subproject.extensions.findByName("android")
            if (androidExt != null && androidExt.hasProperty("namespace")) {
                androidExt.namespace = "carnegietechnologies.gallery_saver"
            }
            if (androidExt != null) {
                androidExt.compileSdkVersion rootProject.ext.compileSdkVersion
                if (androidExt.defaultConfig != null) {
                    androidExt.defaultConfig.targetSdkVersion rootProject.ext.targetSdkVersion
                    androidExt.defaultConfig.minSdkVersion rootProject.ext.minSdkVersion
                }
            }
            subproject.tasks.matching { it.name == "verifyReleaseResources" }.configureEach { task ->
                task.enabled = false
            }
        }
        // Align Kotlin and Java bytecode levels to avoid mismatch (1.8 vs 17)
        subproject.tasks.withType(KotlinCompile).configureEach { task ->
            if (task.kotlinOptions != null) {
                task.kotlinOptions.jvmTarget = '1.8'
            }
        }
    }
    if (subproject.name == "app") {
        subproject.tasks.matching { it.name == "assembleRelease" }.configureEach { task ->
            task.finalizedBy(rootProject.tasks.named("renameFlutterReleaseApk"))
        }
        subproject.tasks.matching { it.name == "bundleRelease" }.configureEach { task ->
            task.finalizedBy(rootProject.tasks.named("renameFlutterReleaseBundle"))
        }
    }
}
