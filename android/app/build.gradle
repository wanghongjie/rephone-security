plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
//    id "com.google.gms.google-services"
//    id "com.google.firebase.crashlytics"
}

def isGlobalRegion = rootProject.hasProperty('targetRegion') && rootProject.property('targetRegion') == 'global'
if (isGlobalRegion) {
    apply plugin: "com.google.gms.google-services"
    apply plugin: "com.google.firebase.crashlytics"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.rephone.security"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // Enable core library desugaring for qr_code_scanner dependency
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }

    flavorDimensions "market"
    productFlavors {
        global {
            dimension "market"
            applicationId = "com.rephone.security"
            buildConfigField "String", "APP_MARKET", "\"global\""
        }
        china {
            dimension "market"
            applicationId = "com.rephone.security.cn"
            buildConfigField "String", "APP_MARKET", "\"china\""
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.rephone.security"
        resValue "string", "app_name", "RePhone"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystoreProperties['storeFile']) {
                storeFile = file(keystoreProperties['storeFile'])
            }
            storePassword = keystoreProperties['storePassword']
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        debug {
            // 使用 release 签名，便于 debug 包也能从 Play 查询 IAP 价格（需与上传证书一致）
            if (keystoreProperties['storeFile']) {
                signingConfig = signingConfigs.release
            }
        }
        release {
            if (keystoreProperties['storeFile']) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Optional: local AAR/JAR adapters under android/app/libs
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    // Pangle mediation SDK (China flavor only)
    chinaImplementation 'com.pangle.cn:mediation-sdk:7.6.1.1'
    // Required by qr_code_scanner (uses Java 8+ APIs in Android libraries)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.0'
}

// china flavor: disable Firebase/FCM related Gradle tasks.
