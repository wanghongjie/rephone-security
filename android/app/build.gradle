plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
//    id "com.google.gms.google-services"
//    id "com.google.firebase.crashlytics"
}

def isGlobalRegion = rootProject.hasProperty('targetRegion') && rootProject.property('targetRegion') == 'global'
if (isGlobalRegion) {
    apply plugin: "com.google.gms.google-services"
    apply plugin: "com.google.firebase.crashlytics"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.rephone.security"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // Enable core library desugaring for qr_code_scanner dependency
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }

    flavorDimensions "market"
    productFlavors {
        global {
            dimension "market"
            applicationId = "com.rephone.security"
            buildConfigField "String", "APP_MARKET", "\"global\""
        }
        china {
            dimension "market"
            applicationId = "com.rephone.security.cn"
            buildConfigField "String", "APP_MARKET", "\"china\""
            // 国内版安装名称：与创建名称/软著名称/备案名称保持一致
            resValue "string", "app_name", "RePhone Security"
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.rephone.security"
        resValue "string", "app_name", "RePhone"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystoreProperties['storeFile']) {
                storeFile = file(keystoreProperties['storeFile'])
            }
            storePassword = keystoreProperties['storePassword']
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        debug {
            // 使用 release 签名，便于 debug 包也能从 Play 查询 IAP 价格（需与上传证书一致）
            if (keystoreProperties['storeFile']) {
                signingConfig = signingConfigs.release
            }
        }
        release {
            if (keystoreProperties['storeFile']) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
            // R8 混淆规则：跳过 Pangle/字节侧缺失类（缺类明细见 proguard-china.pro）。
            // Flutter 工具链已自动为 release 开启 minify 并注入默认规则，此处仅追加本项目规则。
            proguardFiles 'proguard-china.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Optional: local AAR/JAR adapters under android/app/libs
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    // Pangle mediation SDK (China flavor only)
    chinaImplementation 'com.pangle.cn:mediation-sdk:7.6.1.1'
    // Required by qr_code_scanner (uses Java 8+ APIs in Android libraries)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.0'
}

// ==============================================================================
// Play Billing Library 版本锁定（合规修复：2026.8.31 起 Play Console 拒绝 < 8.0 的构建）
// ------------------------------------------------------------------------------
// 现状（2026-08-20 更新）：
//   pubspec 已升级 in_app_purchase_android 到 0.5.0（本机 Flutter 3.41.2 / Dart 3.11.0，
//   0.5.0 要求 Flutter >=3.38 / Dart ^3.10，满足；0.5.0+1 起才要求 Flutter 3.44+/Dart 3.12+，
//   待升级 Flutter 后可自动解析到更高 0.5.x）。
//   0.5.0 内置 com.android.billingclient:billing:8.0.0，天然满足 Play Console ≥8.0.0 门槛，
//   无需再靠 force 提版本。
//
// 保留 resolutionStrategy.force 仅作保险：防止未来其他传递依赖把 billing 拉回 <8.0。
//   · 2026-08-16 已验证：价格查询挂起与版本无关（根因为代理节点不稳），8.0.0 可安全使用。
//   · 未来如需升级到 9.x（Play 尚无强制日期），替换 8.0.0 -> 9.x 即可，
//     但建议先跟踪 flutter/flutter#189974 关于 androidx.core 1.9+ 的前置依赖。
//
// 生效范围：仅对名称含 "global" 的 Configuration（compileClasspath / runtimeClasspath 等）
//   强制覆盖版本；china 变体后续 applicationVariants.all 阶段会直接 exclude 整个
//   billingclient group，无需 force，避免无意义依赖被解析。
// ==============================================================================
configurations.configureEach { config ->
    if (config.name.toLowerCase().contains('global')) {
        config.resolutionStrategy.force(
            // 锁定 Billing Client 原生 aar 至 8.0.0（精确满足 Play Console 合规门槛）。
            // 2026-08-16 已验证：价格查询挂起与版本无关（根因为代理节点不稳），8.0.0 可安全使用。
            // 未来如需升级到 9.x（Play 尚无强制日期），替换 8.0.0 -> 9.x 即可，
            // 但建议先跟踪 flutter/flutter#189974 关于 androidx.core 1.9+ 的前置依赖。
            'com.android.billingclient:billing:8.0.0'
        )
    }
}

// china flavor: disable Firebase/FCM related Gradle tasks.
