//    if (name.contains('china') && (name.contains('googleservices') || name.contains('crashlytics'))) {
//        task.enabled = false
//    }
//}

android.applicationVariants.all { variant ->
    println("[variant-config] variant=${variant.name} flavor=${variant.flavorName} buildType=${variant.buildType.name}")
    if (variant.flavorName == "china") {
        println("[variant-config]   -> china flavor: exclude billingclient/gms/firebase from runtime+compile classpath")
        variant.runtimeConfiguration.exclude group: 'com.android.billingclient'
        variant.runtimeConfiguration.exclude group: 'com.google.android.gms'
        variant.runtimeConfiguration.exclude group: 'com.google.firebase'
        variant.compileConfiguration.exclude group: 'com.android.billingclient'
        variant.compileConfiguration.exclude group: 'com.google.android.gms'
        variant.compileConfiguration.exclude group: 'com.google.firebase'
    }

    if (variant.flavorName == "global") {
        println("[variant-config]   -> global flavor: exclude wechat-sdk from runtime+compile classpath")
        variant.runtimeConfiguration.exclude group: 'com.tencent.mm.opensdk', module: 'wechat-sdk-android'
        variant.compileConfiguration.exclude group: 'com.tencent.mm.opensdk', module: 'wechat-sdk-android'
    }
}

